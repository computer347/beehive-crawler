<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beehive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Tokens
   ========================================================= */
:root{
  --bg:#FBF7EE; --surface:#FFFDF8; --surface-2:#F7F1E4; --sunken:#F1EADA;
  --ink:#2E2B25; --ink-2:#57524A; --muted:#8A8375; --faint:#B6AE9D;
  --line:#EDE5D4; --line-2:#DFD5BF;
  --honey:#F6D66E; --gauge:#E4B53E; --honey-text:#8A680C; --honey-soft:#FBEEBF; --honey-tint:#FDF7E1; --on-honey:#3B2F0C;
  --on-ink:#FFFDF8; --panel:#F5EDDA; --panel-ink:#2E2B25; --panel-muted:#8A7F66; --panel-line:rgba(70,56,20,.16);
  --cell-on:#F4D162; --cell-stroke:#E2BA44; --mono-bg:#2E2B25;
  --danger:#B4452F;
  --shadow-s:0 1px 2px rgba(80,64,30,.05),0 1px 1px rgba(80,64,30,.03);
  --shadow-m:0 10px 28px -12px rgba(80,64,30,.18),0 2px 6px rgba(80,64,30,.05);
  --shadow-l:0 28px 70px -18px rgba(70,56,24,.32);
  --scrim:rgba(46,40,28,.34);

  --r-xs:8px; --r-s:10px; --r-m:14px; --r-l:20px; --r-xl:28px;
  --f-ui:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-display:"Bricolage Grotesque", "Figtree", ui-sans-serif, system-ui, sans-serif;
  --fs-xs:12.5px; --fs-s:13.5px; --fs-m:15px; --fs-l:17px; --fs-xl:21px; --fs-2xl:28px; --fs-3xl:clamp(30px,3.4vw,38px);
  --topbar-h:68px;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#232325; --surface:#2B2B2E; --surface-2:#313134; --sunken:#1D1D1F;
    --ink:#ECE9E2; --ink-2:#C9C5BC; --muted:#9A968D; --faint:#6A6761;
    --line:#37373B; --line-2:#444449;
    --honey:#D4A631; --gauge:#D4A631; --honey-text:#E4BC55; --honey-soft:#3F3722; --honey-tint:#302D27; --on-honey:#231B04;
    --on-ink:#232325; --panel:#1C1C1E; --panel-ink:#ECE9E2; --panel-muted:#8F8B82; --panel-line:rgba(255,255,255,.1);
    --cell-on:#D4A631; --cell-stroke:#D4A631; --mono-bg:#1B1B1D;
    --danger:#E07A63;
    --shadow-s:none; --shadow-m:0 12px 32px -14px rgba(0,0,0,.55); --shadow-l:0 30px 80px -20px rgba(0,0,0,.65);
    --scrim:rgba(10,10,12,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#232325; --surface:#2B2B2E; --surface-2:#313134; --sunken:#1D1D1F;
  --ink:#ECE9E2; --ink-2:#C9C5BC; --muted:#9A968D; --faint:#6A6761;
  --line:#37373B; --line-2:#444449;
  --honey:#D4A631; --gauge:#D4A631; --honey-text:#E4BC55; --honey-soft:#3F3722; --honey-tint:#302D27; --on-honey:#231B04;
  --on-ink:#232325; --panel:#1C1C1E; --panel-ink:#ECE9E2; --panel-muted:#8F8B82; --panel-line:rgba(255,255,255,.1);
  --cell-on:#D4A631; --cell-stroke:#D4A631; --mono-bg:#1B1B1D;
  --danger:#E07A63;
  --shadow-s:none; --shadow-m:0 12px 32px -14px rgba(0,0,0,.55); --shadow-l:0 30px 80px -20px rgba(0,0,0,.65);
  --scrim:rgba(10,10,12,.55);
  color-scheme:dark;
}

/* =========================================================
   Base
   ========================================================= */
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--topbar-h))}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:var(--fs-m);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
a.btn,a.chip{text-decoration:none}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.15}
h1{font-size:var(--fs-3xl);letter-spacing:-.03em}
h2{font-size:var(--fs-l);letter-spacing:-.012em}
h3{font-size:var(--fs-m);letter-spacing:-.005em}
p{margin:0}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--gauge);outline-offset:2px;border-radius:6px}
::selection{background:var(--honey-soft)}
.muted{color:var(--muted)}

/* =========================================================
   Shell
   ========================================================= */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 16px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 26px;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.03em;text-decoration:none}
.brand svg{width:30px;height:30px;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-s);text-decoration:none;color:var(--ink-2);font-weight:500;transition:background .15s,color .15s}
.nav a svg{width:20px;height:20px;flex:none;color:var(--muted);transition:color .15s}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--honey-soft);color:var(--ink);font-weight:600}
.nav a[aria-current="page"] svg{color:var(--honey-text)}
.nav .badge{margin-left:auto;font-size:var(--fs-xs);font-weight:600;background:var(--sunken);color:var(--muted);border-radius:999px;padding:1px 8px}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line)}
.me{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-decoration:none;padding:6px;border-radius:var(--r-s)}
.me:hover{background:var(--surface-2)}
.me-name{font-weight:600;font-size:var(--fs-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-sub{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me > div{min-width:0}
.avatar{flex:none;display:grid;place-items:center;position:relative}
.avatar svg{position:absolute;inset:0;width:100%;height:100%}
.avatar span{position:relative;font-family:var(--f-display);font-weight:700;color:var(--on-honey)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:10;height:var(--topbar-h);display:flex;align-items:center;gap:12px;padding:0 36px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar .brand{display:none;padding:0}
.region-btn{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px 0 14px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-weight:600;font-size:var(--fs-s);box-shadow:var(--shadow-s)}
.region-btn svg{width:16px;height:16px;color:var(--muted)}
.region-btn .pin{color:var(--honey-text)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);position:relative;flex:none;transition:background .15s}
.icon-btn:hover{background:var(--surface)}
.icon-btn svg{width:20px;height:20px}
.icon-btn .dot{position:absolute;top:6px;right:5px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--honey);color:var(--on-honey);font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.content{width:100%;max-width:1200px;margin:0 auto;padding:12px 36px 64px}

.bottom-nav{display:none}

/* =========================================================
   Primitives
   ========================================================= */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-s)}
.card-pad{padding:22px 24px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px 6px}
.card-head.tight{padding-bottom:0}
.link{font-size:var(--fs-s);font-weight:600;color:var(--honey-text);text-decoration:none;border-radius:6px}
.link:hover{text-decoration:underline;text-underline-offset:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:600;font-size:var(--fs-m);white-space:nowrap;transition:transform .12s,background .15s,box-shadow .15s,opacity .15s}
.btn svg{width:18px;height:18px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.primary:hover{box-shadow:0 6px 18px -8px var(--ink)}
.btn.accent{background:var(--honey);color:var(--on-honey)}
.btn.accent:hover{box-shadow:0 8px 20px -8px var(--honey)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.quiet{color:var(--ink-2);padding:0 12px}
.btn.quiet:hover{background:var(--surface-2)}
.btn.sm{height:34px;padding:0 14px;font-size:var(--fs-s)}
.btn.lg{height:52px;padding:0 28px;font-size:var(--fs-l)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.done{background:var(--honey-soft);color:var(--honey-text)}

.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:var(--fs-s);font-weight:500;color:var(--ink-2);white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--faint);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.chip svg{width:15px;height:15px}
.chip .x{opacity:.5;margin-right:-4px}
.chip-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip-row::-webkit-scrollbar{display:none}
.chip-wrap{display:flex;flex-wrap:wrap;gap:8px}

.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:7px;background:var(--sunken);color:var(--ink-2);font-size:var(--fs-xs);font-weight:500;white-space:nowrap}
.tag svg{width:13px;height:13px}
.tag.honey{background:var(--honey-soft);color:var(--honey-text)}
.tag.outline{background:transparent;border:1px dashed var(--line-2);color:var(--muted)}

.skill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font-size:var(--fs-s);font-weight:500}
.skill svg{width:14px;height:14px}
.skill.have{background:var(--honey-soft);color:var(--honey-text)}
.skill.miss{border:1px dashed var(--line-2);color:var(--muted)}

.input{width:100%;height:46px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-m);padding:0 14px;outline:none;font-size:var(--fs-m);transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:var(--faint)}
.input:focus{border-color:var(--gauge);box-shadow:0 0 0 4px color-mix(in srgb,var(--gauge) 22%,transparent)}
textarea.input{height:auto;padding:12px 14px;resize:vertical;line-height:1.5}
.input.invalid{border-color:var(--danger)}
.prefixed{display:flex;align-items:center;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-m);transition:border-color .15s,box-shadow .15s}
.prefixed:focus-within{border-color:var(--gauge);box-shadow:0 0 0 4px color-mix(in srgb,var(--gauge) 22%,transparent)}
.prefixed span{padding-left:14px;color:var(--muted);font-size:var(--fs-m)}
.prefixed input{border:0;box-shadow:none!important;background:transparent;padding-left:2px}
.field{display:flex;flex-direction:column;gap:7px}
.field + .field{margin-top:16px}
.field label,.label{font-size:var(--fs-s);font-weight:600;color:var(--ink-2)}
.field .opt{font-weight:400;color:var(--muted)}
.field .err{font-size:var(--fs-xs);color:var(--danger)}
.row-fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.select{position:relative;display:inline-flex;align-items:center}
.select select{appearance:none;-webkit-appearance:none;height:38px;padding:0 34px 0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:var(--fs-s);font-weight:500;color:var(--ink-2);cursor:pointer;outline:none}
.select select:focus-visible{border-color:var(--gauge)}
.select svg{position:absolute;right:12px;width:15px;height:15px;pointer-events:none;color:var(--muted)}
.select.full{display:flex}
.select.full select{width:100%;height:46px;border-radius:var(--r-m);font-size:var(--fs-m);color:var(--ink)}

.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--sunken);gap:2px}
.seg button{height:32px;padding:0 14px;border-radius:999px;font-size:var(--fs-s);font-weight:500;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-s),0 0 0 1px var(--line)}
.seg.lg button{height:40px;padding:0 20px;font-size:var(--fs-m)}
.seg.block{display:flex}
.seg.block button{flex:1}

.switch{width:44px;height:26px;border-radius:999px;background:var(--line-2);position:relative;flex:none;transition:background .2s}
.switch span{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.3,.7,.3,1)}
.switch[aria-checked="true"]{background:var(--gauge)}
.switch[aria-checked="true"] span{transform:translateX(18px)}

.mono{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:-.01em}
.mono.v0{background:var(--mono-bg);color:var(--honey)}
.mono.v1{background:var(--honey-soft);color:var(--honey-text)}
.mono.v2{background:var(--sunken);color:var(--ink)}
.mono.lg{width:60px;height:60px;border-radius:16px;font-size:20px}
.mono.sm{width:36px;height:36px;border-radius:10px;font-size:13px}

/* hex gauge */
.hex{position:relative;flex:none;display:grid;place-items:center}
.hex svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hex .t{fill:none;stroke:var(--sunken)}
.hex .f{fill:none;stroke:var(--gauge);stroke-linecap:round;stroke-linejoin:round}
.hex.stretch .f{stroke:var(--faint)}
.hex .c{fill:var(--honey-tint)}
.hex.strong .c{fill:var(--honey-soft)}
.hex .v{position:relative;font-family:var(--f-display);font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center}
.hex .v small{font-family:var(--f-ui);font-size:12px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:4px}
.hex.anim .f{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}

.bar-track{height:6px;border-radius:6px;background:var(--sunken);overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:6px;background:var(--gauge);transition:width .6s cubic-bezier(.2,.8,.2,1)}

.empty{padding:48px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .ill{width:64px;height:64px;color:var(--faint)}
.empty h3{font-size:var(--fs-l)}
.empty p{color:var(--muted);max-width:34ch}

/* =========================================================
   Page layouts
   ========================================================= */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:14px 0 28px}
.page-head .lede{color:var(--muted);font-size:var(--fs-l);margin-top:8px}
.page-head.compact{padding:6px 0 18px;align-items:baseline;justify-content:flex-start;gap:12px}
.page-head.compact h1{font-size:var(--fs-2xl)}

/* home */
.home-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:22px;align-items:start}
.stack{display:flex;flex-direction:column;gap:22px}
.strength{display:flex;gap:18px;align-items:center;padding:22px 24px}
.strength p{color:var(--muted);font-size:var(--fs-s);margin:4px 0 12px}
.mini-row{display:flex;align-items:center;gap:12px;padding:12px 24px;border-top:1px solid var(--line);text-decoration:none}
.mini-row:first-of-type{border-top:0}
.mini-row .grow{flex:1;min-width:0}
.mini-row .t1{font-weight:600;font-size:var(--fs-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-row .t2{font-size:var(--fs-s);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.mini-row:hover,button.mini-row:hover{background:var(--surface-2)}
.card-head + .mini-row{border-top:0}
.card > .mini-row:last-child{border-radius:0 0 var(--r-l) var(--r-l);padding-bottom:16px}
.gain{font-size:var(--fs-s);font-weight:700;color:var(--honey-text);white-space:nowrap;font-variant-numeric:tabular-nums}
.urgent{color:var(--honey-text);font-weight:600}

/* job list */
.job-list{display:flex;flex-direction:column}
.job{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:var(--r-m);text-decoration:none;position:relative;transition:background .15s}
.job:hover{background:var(--surface)}
.job[aria-current="true"]{background:var(--surface);box-shadow:var(--shadow-m),0 0 0 1px var(--line)}
.job[aria-current="true"]::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:3px;background:var(--gauge)}
.job-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.job-title{font-weight:600;font-size:var(--fs-m);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job-co{font-size:var(--fs-s);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job-tags{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.job-side{display:flex;flex-direction:column;align-items:center;gap:5px}
.job-age{font-size:var(--fs-xs);color:var(--faint);font-variant-numeric:tabular-nums}
.job-saved{position:absolute;top:12px;right:10px;width:14px;height:14px;color:var(--honey)}
.job-saved path{fill:currentColor}
.card .job-list{padding:6px 8px 10px}
.card .job:hover{background:var(--surface-2)}

/* jobs page */
.jobs{display:grid;grid-template-columns:minmax(330px,420px) minmax(0,1fr);gap:28px;align-items:start}
.jobs-list-col{min-width:0}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;background:var(--surface);border:1px solid var(--line-2);border-radius:999px;box-shadow:var(--shadow-s);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--gauge);box-shadow:0 0 0 4px color-mix(in srgb,var(--gauge) 22%,transparent)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:transparent;outline:none;height:100%;font-size:var(--fs-m);min-width:0}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.search .clear:hover{background:var(--sunken)}
.search .clear svg{width:15px;height:15px}
.filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 10px}
.filter-row .seg{margin-right:auto}
.result-count{font-size:var(--fs-s);color:var(--muted);padding:12px 4px 6px;display:flex;justify-content:space-between;align-items:center}
.select.plain select{border:0;background:transparent;height:30px;padding:0 24px 0 8px;color:var(--ink-2);font-weight:600}
.select.plain svg{right:4px}
.jobs-detail-col{position:sticky;top:calc(var(--topbar-h) + 8px);max-height:calc(100vh - var(--topbar-h) - 24px);max-height:calc(100dvh - var(--topbar-h) - 24px);overflow-y:auto;border-radius:var(--r-l);scrollbar-width:thin}

/* detail */
.detail{padding:28px 30px 34px}
.back{display:none;align-items:center;gap:4px;margin:-8px 0 16px -8px;padding:6px 10px 6px 6px;border-radius:999px;font-weight:600;font-size:var(--fs-s);color:var(--ink-2)}
.back svg{width:18px;height:18px}
.d-top{display:flex;gap:16px;align-items:flex-start}
.d-top .grow{flex:1;min-width:0}
.d-co{font-size:var(--fs-s);color:var(--muted);font-weight:500}
.d-title{font-size:var(--fs-2xl);margin:4px 0 12px;line-height:1.15}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--ink-2);font-size:var(--fs-s)}
.facts span{display:inline-flex;align-items:center;gap:6px}
.facts svg{width:16px;height:16px;color:var(--muted)}
.d-actions{display:flex;gap:10px;margin:22px 0 26px}
.d-actions .btn.accent{min-width:150px}
.match-box{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding:20px 22px;border-radius:var(--r-l);background:var(--honey-tint);border:1px solid color-mix(in srgb,var(--honey) 22%,var(--line))}
.match-box h3{font-size:var(--fs-l)}
.match-box p{color:var(--ink-2);font-size:var(--fs-s);margin-top:4px}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:9px 14px;align-items:center;margin-top:16px;font-size:var(--fs-s)}
.bars em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;min-width:34px}
.d-sec{margin-top:30px}
.d-sec h3{margin-bottom:12px}
.d-sec > p{color:var(--ink-2);max-width:62ch}
.d-sec ul{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.d-sec li{display:flex;gap:10px;color:var(--ink-2);max-width:62ch}
.d-sec li::before{content:"";flex:none;width:6px;height:6px;margin-top:9px;background:var(--gauge);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.gap-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.gap-row:first-of-type{border-top:0;padding-top:4px}
.gap-row .grow{flex:1;min-width:0}
.gap-row .t1{font-weight:600}
.gap-row .t2{font-size:var(--fs-s);color:var(--muted)}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.dl div{background:var(--surface);padding:12px 16px}
.dl dt{font-size:var(--fs-xs);color:var(--muted)}
.dl dd{margin:2px 0 0;font-weight:600;font-size:var(--fs-s)}
.similar{display:flex;flex-direction:column;gap:2px;margin:0 -12px}
.similar .job{padding:10px 12px}
.similar .job:hover{background:var(--surface-2)}

/* insights */
.ins-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:34px;align-items:center;padding:28px 30px}
.ins-hero h2{font-size:var(--fs-xl)}
.dist{display:flex;height:12px;border-radius:12px;overflow:hidden;gap:3px;margin:18px 0 12px}
.dist i{display:block;height:100%;border-radius:3px}
.dist .s{background:var(--gauge)} .dist .r{background:color-mix(in srgb,var(--gauge) 38%,var(--surface))} .dist .x{background:var(--line-2)}
.legend{display:flex;gap:22px;flex-wrap:wrap;font-size:var(--fs-s);color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px}
.legend b{font-variant-numeric:tabular-nums}
.ins-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;margin-top:22px;align-items:start}
.sim-note{margin:0 24px 8px;padding:12px 14px;border-radius:var(--r-m);background:var(--sunken);font-size:var(--fs-s);color:var(--ink-2)}
.sim-note b{color:var(--ink)}
.sim-note.on{background:var(--honey-soft)}
.country{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;align-items:center;gap:16px;padding:13px 24px;border-top:1px solid var(--line);width:100%;text-align:left;transition:background .15s}
.country:first-of-type{border-top:0}
.country:hover{background:var(--surface-2)}
.country .t1{font-weight:600}
.country .t2{font-size:var(--fs-s);color:var(--muted)}
.country[aria-current="true"] .t1::after{content:"Current";margin-left:8px;font-size:var(--fs-xs);font-weight:600;color:var(--honey-text);background:var(--honey-soft);padding:2px 8px;border-radius:6px;vertical-align:1px}
.card > .country:last-child,.card > .gap-pad:last-child{border-radius:0 0 var(--r-l) var(--r-l)}
.gap-pad{padding:0 24px 12px}
.type-bars{display:grid;grid-template-columns:auto 1fr auto;gap:12px 16px;align-items:center;padding:8px 24px 22px;font-size:var(--fs-s)}
.type-bars em{font-style:normal;font-weight:600;font-variant-numeric:tabular-nums}

/* qualifications */
.q-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
.q-sec{padding:22px 24px 24px}
.q-sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.q-sec-head .muted{font-size:var(--fs-s)}
.q-desc{color:var(--muted);font-size:var(--fs-s);margin-bottom:18px}
.skill-group + .skill-group{margin-top:16px}
.skill-group .label{display:block;font-weight:500;color:var(--muted);font-size:var(--fs-xs);margin-bottom:8px}
.skill-chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 8px 0 14px;border-radius:999px;background:var(--honey-soft);color:var(--honey-text);font-size:var(--fs-s);font-weight:600}
.skill-chip button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:inherit;opacity:.65}
.skill-chip button:hover{opacity:1;background:color-mix(in srgb,var(--honey) 25%,transparent)}
.skill-chip svg{width:13px;height:13px}
.adder{position:relative;margin-top:20px}
.adder .search{box-shadow:none;height:46px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sugg .chip{height:30px;font-size:var(--fs-xs);padding:0 12px;color:var(--muted)}
.sugg .chip svg{width:13px;height:13px}
.lang{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.lang:first-of-type{border-top:0}
.lang .name{font-weight:600;flex:1;min-width:90px}
.lang .seg button{padding:0 11px;height:30px;font-size:var(--fs-xs)}
.link-card{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface-2)}
.link-card .grow{flex:1;min-width:0}
.link-card .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-card .t2{font-size:var(--fs-xs);color:var(--muted)}
.link-card .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--mono-bg);color:var(--honey);flex:none}
.link-card .ic svg{width:20px;height:20px}
.plan-progress{display:flex;align-items:center;gap:12px;margin:4px 0 16px;font-size:var(--fs-s);color:var(--muted)}
.plan-progress .bar-track{flex:1}
.todo{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.todo:first-of-type{border-top:0}
.todo .grow{flex:1;min-width:0}
.todo .t1{font-weight:600}
.todo .t2{font-size:var(--fs-s);color:var(--muted)}
.todo.done .t1{text-decoration:line-through;color:var(--muted)}
.check{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:transparent;transition:background .15s,border-color .15s}
.check svg{width:15px;height:15px}
.check[aria-checked="true"]{background:var(--honey);border-color:var(--gauge);color:var(--on-honey)}
.cert{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.cert:first-of-type{border-top:0}
.cert svg.a{width:20px;height:20px;color:var(--honey-text);flex:none}
.cert span{flex:1;font-weight:500}
.inline-add{display:flex;gap:8px;margin-top:14px}
.inline-add .input{flex:1}
.remove{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.remove:hover{background:var(--sunken);color:var(--ink)}
.remove svg{width:16px;height:16px}

.live-pill{display:inline-flex;align-items:center;gap:7px;margin-left:auto;font-size:var(--fs-xs);font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.live-pill i{width:7px;height:7px;border-radius:50%;background:#4CAF6E;box-shadow:0 0 0 3px color-mix(in srgb,#4CAF6E 22%,transparent)}
.btn svg{flex:none}
/* evidence, coursework, projects */
.skill-chip.self{background:transparent;border:1px solid var(--line-2);color:var(--ink-2)}
.skill-chip .ev{font-size:11px;font-weight:700;background:var(--surface);color:var(--honey-text);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.skill-chip .pad{width:4px}
.skill.self{border:1px solid var(--line-2);color:var(--ink-2)}
.fine{font-size:var(--fs-xs);color:var(--muted);margin-top:10px}
.q-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.q-actions .btn svg{width:16px;height:16px}
.course{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.course:first-child{border-top:0}
.course .grow{flex:1;min-width:0}
.course .t1{font-weight:600;font-size:var(--fs-s)}
.course .t2{font-size:var(--fs-xs);color:var(--faint);margin-top:3px}
.course .code{font-size:var(--fs-xs);font-weight:600;color:var(--muted);margin-right:8px;font-variant-numeric:tabular-nums}
.course .ects{font-size:var(--fs-s);font-weight:600;color:var(--ink-2);padding-top:5px;white-space:nowrap}
.course .remove{margin-top:-2px}
.sk{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag.xs{height:20px;font-size:11px;padding:0 7px;border-radius:6px}
.tag.ai{background:var(--mono-bg);color:var(--honey)}
.tag.ai svg{width:13px;height:13px}
.proj{padding:14px 0;border-top:1px solid var(--line)}
.proj:first-of-type{border-top:0}
.proj-top{display:flex;gap:12px;align-items:flex-start}
.proj-top .grow{flex:1;min-width:0}
.proj-top .t1{font-weight:600}
.proj-top .t1 a{text-decoration:none}
.proj-top .t1 a:hover{text-decoration:underline;text-underline-offset:3px}
.proj-top .t2{font-size:var(--fs-s);color:var(--muted);margin-top:2px}
.proj-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--honey-soft);color:var(--honey-text);flex:none}
.proj-ic svg{width:18px;height:18px}
.proj-tags{margin:10px 0 0 48px}
.proj-tags .tag{height:22px}
.ai-detail{margin:6px 0 0 48px;font-size:var(--fs-xs);color:var(--muted)}
.modal.wide{width:min(640px,100%)}
.paste{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.55}
.status{display:flex;gap:10px;align-items:center;font-size:var(--fs-s);color:var(--muted);margin-top:14px}
.spin{width:18px;height:18px;flex:none;animation:spin 1.1s linear infinite}
.spin path{fill:none;stroke:var(--gauge);stroke-width:9;stroke-dasharray:60 40;stroke-linecap:round}
@keyframes spin{to{transform:rotate(360deg)}}
.pv-sum{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:var(--fs-s);color:var(--ink-2)}
.pv-list{max-height:min(46vh,380px);overflow:auto;border:1px solid var(--line);border-radius:var(--r-m);margin-top:12px;padding:0 14px}
.pv-row{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.pv-row:first-child{border-top:0}
.pv-row .check{margin-top:1px}
.pv-row .grow{flex:1;min-width:0}
.pv-row.off .grow{opacity:.45}
.ai-box{margin-top:16px;padding:16px;border-radius:var(--r-m);background:var(--surface-2);border:1px solid var(--line)}
.ai-box .label{display:block;margin-bottom:8px}
.ai-kind{display:flex;align-items:center;gap:10px;font-weight:600}
.ai-kind .proj-ic{width:32px;height:32px}
.ai-kind small{display:block;font-weight:400;color:var(--muted);font-size:var(--fs-xs)}
.via{font-size:var(--fs-xs);color:var(--faint)}

/* account */
.acc-head{display:flex;align-items:center;gap:20px;padding:24px}
.acc-head h2{font-size:var(--fs-xl)}
.acc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:22px;align-items:start}
.pref{display:flex;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.pref:first-of-type{border-top:0}
.pref .grow{flex:1}
.pref .t1{font-weight:600}
.pref .t2{font-size:var(--fs-s);color:var(--muted)}
.theme-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.theme-opt{border:1.5px solid var(--line);border-radius:var(--r-m);padding:10px;display:flex;flex-direction:column;gap:10px;font-size:var(--fs-s);font-weight:600;text-align:left;transition:border-color .15s}
.theme-opt[aria-checked="true"]{border-color:var(--gauge)}
.theme-opt .pv{height:58px;border-radius:9px;display:flex;overflow:hidden;border:1px solid var(--line)}
.theme-opt .pv i{flex:1}
.theme-opt .pv b{width:34%;display:flex;align-items:flex-end;padding:6px}
.theme-opt .pv b::after{content:"";width:100%;height:8px;border-radius:4px;background:var(--pv,#F6D66E)}
.danger-zone{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:22px;padding:18px 24px}
.btn.danger{color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 8%,transparent)}

/* =========================================================
   Overlays
   ========================================================= */
.pop{position:fixed;z-index:50;width:320px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-l);padding:8px;transform-origin:top left;animation:pop .16s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.pop-title{font-size:var(--fs-xs);color:var(--muted);padding:8px 12px 6px;font-weight:500}
.pop-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:var(--r-s);text-align:left}
.pop-item:hover,.pop-item:focus-visible{background:var(--surface-2)}
.pop-item[aria-checked="true"]{background:var(--honey-tint)}
.pop-item .grow{flex:1}
.pop-item .t1{font-weight:600;font-size:var(--fs-m)}
.pop-item .t2{font-size:var(--fs-xs);color:var(--muted)}
.pop-item .ok{width:18px;height:18px;color:var(--honey-text)}

.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(520px,100%);max-height:calc(100dvh - 40px);overflow:auto;background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow-l);animation:rise .25s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
.modal-head{display:flex;gap:14px;align-items:center;padding:24px 24px 6px}
.modal-head .grow{flex:1;min-width:0}
.modal-head h2{font-size:var(--fs-xl)}
.modal-head p{color:var(--muted);font-size:var(--fs-s);margin-top:2px}
.modal-body{padding:18px 24px 8px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:18px 24px 24px}
.share{margin-top:18px;padding:14px 16px;border-radius:var(--r-m);background:var(--surface-2);border:1px solid var(--line)}
.share ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:var(--fs-s);color:var(--ink-2)}
.share li{display:flex;gap:9px;align-items:center}
.share li svg{width:16px;height:16px;color:var(--honey-text);flex:none}
.success{padding:40px 28px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.success .hexmark{width:72px;height:72px;margin-bottom:8px}
.success p{color:var(--muted);max-width:36ch}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);z-index:80;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--on-ink);padding:10px 12px 10px 18px;border-radius:999px;font-size:var(--fs-s);font-weight:500;box-shadow:var(--shadow-l);animation:toast .25s cubic-bezier(.2,.8,.2,1)}
.toast.solo{padding-right:18px}
.toast button{color:var(--honey);font-weight:700;padding:4px 8px;border-radius:999px}
@keyframes toast{from{opacity:0;transform:translate(-50%,10px)}}

/* =========================================================
   Onboarding
   ========================================================= */
.ob{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;grid-template-columns:minmax(360px,44%) 1fr;overflow:hidden}
.ob-panel{background:var(--panel);color:var(--panel-ink);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 34px) 44px 36px;position:relative;overflow:hidden}
.ob-panel .brand{padding:0;color:var(--panel-ink)}
.ob-panel .comb{flex:1;display:grid;place-items:center}
.ob-panel .comb svg{width:min(80%,360px);height:auto;overflow:visible}
.cell{fill:transparent;stroke:var(--panel-line);stroke-width:1.5;transition:fill .5s cubic-bezier(.2,.8,.2,1),stroke .5s}
.cell.on{fill:var(--cell-on);stroke:var(--cell-stroke)}
.cell.half{fill:color-mix(in srgb,var(--cell-on) 22%,transparent);stroke:color-mix(in srgb,var(--cell-stroke) 60%,transparent)}
.ob-panel .foot{display:flex;gap:28px;color:var(--panel-muted);font-size:var(--fs-s)}
.ob-panel .foot b{display:block;color:var(--panel-ink);font-family:var(--f-display);font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ob-main{overflow-y:auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 34px) 56px calc(env(safe-area-inset-bottom,0px) + 34px)}
.ob-top{display:flex;align-items:center;gap:16px;min-height:40px}
.ob-top .brand{display:none;padding:0}
.ob-progress{flex:1;max-width:320px;display:flex;flex-direction:column;gap:8px;margin-left:auto}
.ob-progress .bar-track{height:4px}
.ob-progress span{font-size:var(--fs-xs);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.ob-body{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:560px;padding:40px 0}
.ob-body h1{font-size:clamp(30px,3.6vw,42px);margin-bottom:10px}
.ob-body .lede{color:var(--muted);font-size:var(--fs-l);margin-bottom:30px}
.ob-body .step-anim{animation:stepIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes stepIn{from{opacity:0;transform:translateY(10px)}}
.big-input{height:60px;font-size:22px;border-radius:var(--r-l);padding:0 20px;font-family:var(--f-display);letter-spacing:-.01em}
.combo-list{margin-top:10px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);overflow:hidden;max-height:340px;overflow-y:auto}
.combo-opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 18px;text-align:left;border-top:1px solid var(--line)}
.combo-opt:first-child{border-top:0}
.combo-opt .grow{flex:1;font-weight:500}
.combo-opt .cc{font-size:var(--fs-xs);color:var(--muted)}
.combo-opt:hover,.combo-opt.active{background:var(--surface-2)}
.combo-opt[aria-selected="true"]{background:var(--honey-tint)}
.combo-opt[aria-selected="true"] .grow{font-weight:700}
.combo-opt .ok{width:18px;height:18px;color:var(--honey-text)}
.deg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.deg{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--surface);text-align:left;font-weight:600;transition:border-color .15s,background .15s}
.deg:hover{border-color:var(--line-2)}
.deg svg{width:22px;height:22px;color:var(--muted);flex:none}
.deg[aria-checked="true"]{border-color:var(--gauge);background:var(--honey-tint)}
.deg[aria-checked="true"] svg{color:var(--honey-text)}
.years{display:flex;gap:10px}
.year{width:56px;height:56px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:20px;font-weight:600;transition:border-color .15s,background .15s}
.year[aria-checked="true"]{border-color:var(--gauge);background:var(--honey-soft);color:var(--honey-text)}
.grad-note{margin-top:22px;display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:var(--fs-s);color:var(--ink-2)}
.grad-note svg{width:16px;height:16px;color:var(--honey-text)}
.ob-label{font-size:var(--fs-s);font-weight:600;color:var(--ink-2);margin:0 0 12px}
.ob-label + *{margin-bottom:28px}
.ob .chip{height:40px;padding:0 16px;font-size:var(--fs-m)}
.ob .chip[aria-pressed="true"]{background:var(--honey-soft);border-color:var(--gauge);color:var(--honey-text)}
.ob .chip[aria-pressed="true"] svg{color:var(--honey-text)}
.ob-foot{display:flex;align-items:center;gap:12px;width:100%;max-width:560px}
.ob-foot .hint{font-size:var(--fs-xs);color:var(--faint);margin-left:auto;margin-right:6px}
.ob-foot kbd{font-family:var(--f-ui);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted)}
.welcome h1{font-size:clamp(38px,5vw,60px);line-height:1.02;letter-spacing:-.04em;max-width:12ch;margin-bottom:18px}
.welcome .lede{max-width:40ch}
.welcome .note{margin-top:16px;font-size:var(--fs-s);color:var(--muted)}
.building{position:fixed;inset:0;z-index:45;background:var(--panel);color:var(--panel-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;animation:fade .3s}
.building svg{width:180px;height:auto;overflow:visible}
.building .cell,.animfill .cell{animation:fillc .45s forwards}
@keyframes fillc{to{fill:var(--cell-on);stroke:var(--cell-stroke)}}
.building p{font-family:var(--f-display);font-size:var(--fs-xl);letter-spacing:-.01em}
.building small{color:var(--panel-muted);font-size:var(--fs-s);margin-top:-18px}

   ========================================================= */
@media (max-width:1180px){
  .app{grid-template-columns:78px minmax(0,1fr)}

  .nav a{justify-content:center;padding:12px}
  .side-foot{flex-direction:column;padding:12px 0 0}
  .me{flex:none}
  .topbar,.content{padding-left:28px;padding-right:28px}
  .home-grid{grid-template-columns:minmax(0,1fr) 300px}
}
@media (max-width:980px){

  .ob{grid-template-columns:minmax(300px,38%) 1fr}

}

@media (prefers-reduced-motion:reduce){

}

function evidenceMap(){
  const m = {};
  const add = s => m[s] ||= {courses:[], projects:[], ects:0};
  S.courses.forEach(c=>c.skills.forEach(s=>{ const e=add(s); e.courses.push(c); e.ects += +c.ects||0; }));
  S.projects.forEach(p=>p.skills.forEach(s=>{ add(s).projects.push(p); }));
  return m;
}
const allSkills = () => [...new Set([...S.skills, ...Object.keys(evidenceMap())])];

const related = (a,b) => GROUPS.some(g=>g.includes(a)&&g.includes(b));
function scoreJob(job, extra=[]){
  const p = S.profile;
  if(!p) return {total:0, band:"stretch", parts:{field:0,skills:0,phase:0,lang:0}, matched:[], missing:job.skills, missingLang:[]};
  const ev = evidenceMap();
  const have = new Set([...S.skills, ...Object.keys(ev), ...extra].map(norm));
  const backedSet = new Set([...Object.keys(ev), ...extra].map(norm));
  const langOk = new Set(S.langs.filter(x=>x.v!=="Basic").map(x=>x.l));
  extra.forEach(x=>{ if(LANGS.includes(x)) langOk.add(x) });
  const field = job.fields.includes(p.field) ? 1 : job.fields.some(f=>related(f,p.field)) ? .45 : 0;
  const matched = job.skills.filter(s=>have.has(norm(s)));
  const backed = matched.filter(s=>backedSet.has(norm(s)));
  const skills = job.skills.length ? (backed.length + (matched.length-backed.length)*.8) / job.skills.length : .5;
  const li = LEVELS.indexOf(p.level);
  let phase, phaseNote = "";
  if(job.lvl==="M" && li===0){ phase = p.year>=3 ? .45 : .1; phaseNote = "It's aimed at master's students."; }
  else {
    const eff = li>0 ? p.year+3 : p.year;
    phase = eff>=job.minYear ? 1 : eff===job.minYear-1 ? .6 : .25;
    if(phase<1) phaseNote = `Most applicants are in year ${job.minYear} or later.`;
  }
  const need = job.langs.filter(l=>l!=="English");
  const missingLang = need.filter(l=>!langOk.has(l));
  const lang = missingLang.length ? .25 : 1;
  let bonus = 0;
  if(S.github && job.skills.some(s=>SKILL_GROUPS.Programming.includes(s))) bonus += 4;
  if(S.certs.length) bonus += 2;
  if(S.projects.length && job.skills.some(s=>SKILL_GROUPS.Programming.includes(s)||SKILL_GROUPS["AI and machine learning"].includes(s))) bonus += 2;
  const total = Math.max(3, Math.min(99, Math.round(field*35 + skills*40 + phase*15 + lang*10 + bonus)));
  const band = total>=70 ? "strong" : total>=45 ? "reach" : "stretch";
  return {total, band, parts:{field,skills,phase,lang}, matched, backed, missing:job.skills.filter(s=>!have.has(norm(s))), missingLang, phaseNote};
}

function explain(j,m){
  const f = m.parts.field===1 ? "Your degree is a direct fit" : m.parts.field>0 ? "Your degree is closely related" : "Your degree isn't one they list";
  if(!j.skills.length) return `${f}. The ad doesn't list specific skills, so read it for what they value.${m.phaseNote?" "+m.phaseNote:""}${m.missingLang.length?` They also want ${m.missingLang.join(" and ")}.`:""}`;
  let s = `${f}, and you have ${m.matched.length} of ${j.skills.length} skills they ask for`;
  s += m.backed.length ? `, ${m.backed.length===m.matched.length?"all":m.backed.length} backed by coursework or projects.` : m.matched.length ? ", all self-reported so far." : ".";
  if(m.phaseNote) s += " " + m.phaseNote;
  if(m.missingLang.length) s += ` They also want ${m.missingLang.join(" and ")}.`;
  return s;
}

function gapsFor(jobs, extra=[]){
  const p = S.profile, map = {};
  jobs.forEach(j=>{
    const base = scoreJob(j, extra);
    if(!(j.fields.includes(p.field) || j.fields.some(f=>related(f,p.field)))) return;
    [...base.missing, ...base.missingLang].forEach(s=>{
      const after = scoreJob(j, [...extra, s]).total;
      const e = map[s] ||= {s, roles:0, gain:0, unlock:0};
      e.roles++; e.gain += after-base.total;
      if(base.total<70 && after>=70) e.unlock++;
    });
  });
  return Object.values(map).sort((a,b)=>b.unlock-a.unlock || b.roles-a.roles || b.gain-a.gain);
}

/* =========================================================

   ========================================================= */
function route(){
  const h = location.hash.replace(/^#\/?/,"") || "home";
  const [page,id] = h.split("/");
  return {page: NAV.some(n=>n[0]===page)?page:"home", id};
}
function go(path){ location.hash = "#/"+path; }
function renderPage(){
  if(!S.profile) return;
  const {page,id} = route();
  if(page==="jobs" && ui.page==="jobs"){ updateJobsSelection(id); updateShell(); return; }
  ui.page = page;
  const v = $("#view");
  if(page==="home") v.innerHTML = viewHome();
  if(page==="jobs") { v.innerHTML = viewJobs(); renderJobList(); updateJobsSelection(id, true); }
  if(page==="insights") v.innerHTML = viewInsights();
  if(page==="qualifications") v.innerHTML = viewQuals();
  if(page==="account") v.innerHTML = viewAccount();
  updateShell(); animate(v);
  window.scrollTo(0,0);
}
function refresh(){ const y = scrollY; ui.page = null; renderPage(); window.scrollTo(0,y); }
window.addEventListener("hashchange", renderPage);

function liveAge(){ const h = LIVE_META ? Math.floor((Date.now()-Date.parse(LIVE_META.at))/36e5) : 0; return h<1?"updated just now":h<24?`updated ${h}h ago`:`updated ${Math.floor(h/24)}d ago`; }
function filteredJobs(){
  const q = norm(ui.q);
  let list = regionJobs().filter(j=>
    (ui.type==="all" || j.type===ui.type) &&
    (ui.mode==="all" || j.mode===ui.mode) &&
    (ui.scope==="all" || (ui.scope==="saved"?S.saved.includes(j.id):!!S.applied[j.id])) &&
    (!q || [j.t,j.c,j.city,j.ind,...j.skills].join(" ").toLowerCase().includes(q)));
  if(ui.sort==="new") list.sort((a,b)=>a.days-b.days);
  if(ui.sort==="deadline") list.sort((a,b)=>(a.dl??1e9)-(b.dl??1e9));
  return list;
}
function renderJobList(){

function skillsCard(){
  const ev = evidenceMap(), all = allSkills(), groups = {};
  all.forEach(sk=>{ const g = Object.keys(SKILL_GROUPS).find(k=>SKILL_GROUPS[k].includes(sk)) || "Other"; (groups[g] ||= []).push(sk); });
  const order = [...Object.keys(SKILL_GROUPS),"Other"].filter(g=>groups[g]);
  const backed = all.filter(x=>ev[x]).length;

const kwSkills = t => [...new Set(KW.filter(([r])=>r.test(t)).map(([,x])=>x))];
const pickSkills = arr => [...new Set((Array.isArray(arr)?arr:[]).map(x=>SKILLS.find(k=>norm(k)===norm(x))).filter(Boolean))];
const uid = () => Math.random().toString(36).slice(2,9);
function parseCoursesLocal(text){
  return text.split(/\n+/).map(l=>l.trim()).filter(l=>l.length>3 && !/^(total|yhteensä|summa|gpa|average)/i.test(l)).map(l=>{
    const code = (l.match(/\b[A-Z]{2,6}-?[A-Z]?\d{2,5}[A-Z0-9.]*\b/)||[""])[0];
    const em = l.match(/(\d+(?:[.,]\d+)?)\s*(?:cr|op|ects|credits?|hp|sp|ov)\b/i);
    const ects = em ? parseFloat(em[1].replace(",", ".")) : null;
    let name = l.replace(code,"").replace(em?em[0]:"","").replace(/\s+(\d|[A-F]|pass|hyv\.?|hyväksytty)\s*$/i,"").replace(/[\t|;]+/g," ").replace(/\s{2,}/g," ").replace(/^[\s,:.-]+|[\s,:.-]+$/g,"");
    return {code, name, ects, skills:kwSkills(l)};
  }).filter(c=>c.name.length>2 && /[a-zà-ÿ]/i.test(c.name)).slice(0,80);
}
function normCourse(c){
  const name = String(c?.name||"").trim().slice(0,120); if(!name) return null;
  let ects = Number(String(c.ects??"").replace(",", ".")); if(!(ects>0 && ects<=60)) ects = null;
  return {id:uid(), code:String(c.code||"").trim().slice(0,24), name, ects, skills:pickSkills(c.skills)};
}
function analyseProjectLocal(name, text){
  const all = name+"\n"+text;
  const llm = /\bllms?\b|language model|openai|anthropic|\bgpt|langchain|llamaindex|ollama|\brag\b|embeddings?|hugging ?face|transformers/i.test(all);
  const train = /pytorch|tensorflow|keras|train(ed|ing|s)? (a |the |our |my )?(model|network|classifier)|fine.?tun|scikit|sklearn/i.test(all);
  const assist = /copilot|cursor|claude code|ai.assisted|codex|co-authored-by: claude|claude\.md|cursorrules/i.test(all);
  const kinds = [llm&&"llm_api", train&&"model_training", assist&&"ai_assisted_dev"].filter(Boolean);
  const words = text.split(/\s+/).filter(Boolean).length;
  const first = (text.replace(/^#.*$/gm,"").match(/[^.\n]{12,}[.\n]/)||[""])[0].trim();
  const names = {llm_api:"LLM APIs", model_training:"model training", ai_assisted_dev:"AI coding tools"};
  const detail = kinds.length ? kinds.map(k=>names[k]).join(" and ").replace(/^./,c=>c.toUpperCase()) : "";
  return {summary: first.slice(0,120) || `${name} project`, skills: kwSkills(all), ai:{kind: kinds.length>1?"multiple":kinds[0]||"none", detail}, size: words>450?"substantial":words>140?"medium":"small"};
}
const COURSE_PROMPT = t => `You read transcripts and course lists from Nordic universities. The text may be Finnish, Swedish, Norwegian, Danish, Icelandic or English.
Extract every course. Reply with only a JSON array, one object per course:
{"code": string or "", "name": string (the English name if the text gives one, otherwise as written), "ects": number or null, "skills": array of strings}
"op", "hp", "sp" and "cr" are all ECTS credits. Ignore totals, headers, GPA and thesis grade lines.
"skills" may only contain items from this list, and only when the course clearly teaches them:
${SKILLS.join(", ")}

Text:
"""
${t.slice(0,14000)}
"""`;
const PROJECT_PROMPT = (n,u,t) => `You review student software projects for a Nordic student recruiting platform.
From the material below (description, README, dependency files or commit messages), reply with only one JSON object:
{"summary": "one plain sentence under 20 words saying what the project does",
 "skills": [items from this list that the project clearly demonstrates: ${SKILLS.join(", ")}],
 "ai": {"kind": "none" | "llm_api" | "model_training" | "ai_assisted_dev" | "multiple", "detail": "short phrase naming the tools or models, or empty"},
 "size": "small" | "medium" | "substantial"}
Use "llm_api" when the project calls a language model (OpenAI, Anthropic, local models through Ollama, LangChain, retrieval). Use "model_training" when it trains or fine-tunes models. Use "ai_assisted_dev" when it was built with AI coding tools (Claude Code, Copilot, Cursor, a CLAUDE.md file, AI co-author trailers). Use "multiple" when more than one applies. Judge only from the material.

Project name: ${n}
Link: ${u||"none"}
Material:
"""
${t.slice(0,14000)}
"""`;
async function askClaude(prompt){
  if(!SAMPLE) return null;
  aiCtl = new AbortController();
  try{ return await SAMPLE.json(prompt, {modelTier:"quick", signal:aiCtl.signal}); }
  catch(e){ if(e?.code==="cancelled") throw e; if(HARD_STOP.includes(e?.code)) SAMPLE = null; return null; }
}
const spinner = `<svg class="spin" viewBox="0 0 100 100" aria-hidden="true"><path d="${"M50 6 88 28v44L50 94 12 72V28Z"}" pathLength="100"/></svg>`;
function setStatus(id, msg){ const el = $("#"+id); if(!el) return; el.hidden = !msg; el.innerHTML = msg ? spinner + `<span>${esc(msg)}</span>` : ""; }

/* coursework import */
let courseDraft = null, ciText = "";
function openCourseImport(){
  courseDraft = null;
  modal(`<div class="modal-head"><div class="grow"><h2>Import coursework</h2><p>Paste your course list from Sisu, Ladok, StudentWeb or a PDF transcript.</p></div><button class="icon-btn" data-act="close" aria-label="Close">${I.x}</button></div>
    <div class="modal-body" id="ciBody"></div><div class="modal-foot" id="ciFoot"></div>`, "wide");
  ciEdit();
}
function ciEdit(){
  $("#ciBody").innerHTML = `<div class="field"><label for="ciText">Courses</label><textarea class="input paste" id="ciText" rows="10" placeholder="ELEC-A7100  Basic course in C programming  5 op  4
MS-A0503  First course in probability and statistics  5 op  3
ELEC-C5231  Signals and systems  5 op  5">${esc(ciText)}</textarea></div>
    <p class="fine">Any layout works. One course per line gives the cleanest result.</p><div class="status" id="ciStatus" hidden></div>`;
  $("#ciFoot").innerHTML = `<button class="btn quiet" data-act="close">Cancel</button><button class="btn accent" data-act="read-courses">Read courses</button>`;
  $("#ciText").focus();
}
async function readCourses(){
  const text = $("#ciText").value.trim(); if(!text){ $("#ciText").focus(); return; }
  ciText = text; $("[data-act=read-courses]").disabled = true; $("#ciText").readOnly = true;
  setStatus("ciStatus", SAMPLE ? "Reading your courses. This takes a few seconds." : "Reading your courses");
  let list = null, via = "device";
  try{ const r = await askClaude(COURSE_PROMPT(text)); if(Array.isArray(r) && r.length){ list = r; via = "claude"; } }catch(e){ return; }
  if(!list) list = parseCoursesLocal(text);
  courseDraft = list.map(normCourse).filter(Boolean).map(c=>({...c, on:true}));
  if(!$("#ciBody")) return;
  if(!courseDraft.length){ ciEdit(); setStatus("ciStatus",""); toast("No courses found. Try one course per line."); return; }
  ciPreview(via);
}
function ciPreview(via){
  const on = courseDraft.filter(c=>c.on), ects = on.reduce((a,c)=>a+(c.ects||0),0);
  $("#ciBody").innerHTML = `<div class="pv-sum"><span><b class="num">${on.length}</b> of ${plural(courseDraft.length,"course")} selected, <b class="num">${Math.round(ects)}</b> ECTS</span><span class="via">${via==="claude"?"Read by Claude":"Read on this device"}</span></div>
    <div class="pv-list">${courseDraft.map((c,i)=>`<div class="pv-row ${c.on?"":"off"}"><button class="check" role="checkbox" aria-checked="${c.on}" data-act="ci-toggle" data-v="${i}" aria-label="Include ${esc(c.name)}">${I.check}</button>
      <div class="grow"><div class="course" style="padding:0;border:0"><div class="grow"><div class="t1">${c.code?`<span class="code">${esc(c.code)}</span>`:""}${esc(c.name)}</div>${c.skills.length?`<div class="sk">${c.skills.map(x=>`<span class="tag xs">${esc(x)}</span>`).join("")}</div>`:`<div class="t2">No skills mapped</div>`}</div>${c.ects?`<span class="ects num" style="padding-top:0">${fmtNum(c.ects)} cr</span>`:""}</div></div></div>`).join("")}</div>`;
  $("#ciFoot").innerHTML = `<button class="btn quiet" data-act="ci-edit">${I.chevLeft}Edit text</button><button class="btn accent" data-act="ci-add" ${on.length?"":"disabled"}>Add ${plural(on.length,"course")}</button>`;
  $("#ciFoot").dataset.via = via;
}
function addDraftCourses(){
  const keyOf = c => norm((c.code||"")+"|"+c.name);
  const have = new Set(S.courses.map(keyOf));
  const add = courseDraft.filter(c=>c.on && !have.has(keyOf(c))).map(({on,...c})=>c);
  S.courses.push(...add); save(); closeLayer(); refreshQuals();
  toast(add.length ? `Added ${plural(add.length,"course")}` : "Those courses were already added");
}
function openCourseManual(){
  modal(`<div class="modal-head"><div class="grow"><h2>Add a course</h2><p>Skills are suggested from the course name. Adjust them if needed.</p></div><button class="icon-btn" data-act="close" aria-label="Close">${I.x}</button></div>
    <div class="modal-body">
      <div class="field"><label for="mcName">Course name</label><input class="input" id="mcName" placeholder="e.g. Signals and systems"></div>
      <div class="row-fields" style="margin-top:16px"><div class="field"><label for="mcCode">Code <span class="opt">optional</span></label><input class="input" id="mcCode" placeholder="ELEC-C5231"></div>
      <div class="field" style="margin:0"><label for="mcEcts">Credits (ECTS)</label><input class="input" id="mcEcts" inputmode="decimal" placeholder="5"></div></div>
      <div class="field" style="margin-top:16px"><span class="label">Skills it taught</span><div class="chip-wrap" id="mcSkills"></div></div>
    </div>
    <div class="modal-foot"><button class="btn quiet" data-act="close">Cancel</button><button class="btn accent" data-act="mc-save">Add course</button></div>`);
  mcPicked = new Set(); mcRender();
}
let mcPicked = new Set();
function mcRender(){
  const name = $("#mcName")?.value || "";
  kwSkills(name).forEach(x=>mcPicked.add(x));
  const pool = [...new Set([...mcPicked, ...kwSkills(name), ...(FIELD_SKILLS[S.profile.field]||[])])];
  $("#mcSkills").innerHTML = pool.map(x=>`<button class="chip" data-act="mc-skill" data-v="${esc(x)}" aria-pressed="${mcPicked.has(x)}">${mcPicked.has(x)?I.check:I.plus}${esc(x)}</button>`).join("");
}

/* project analysis */
let projForm = {name:"", url:"", text:""}, projDraft = null;
function openProject(){
  projForm = {name:"", url:"", text:""}; projDraft = null;
  modal(`<div class="modal-head"><div class="grow"><h2>Add a project</h2><p>Describe it, or paste the README and dependency files.</p></div><button class="icon-btn" data-act="close" aria-label="Close">${I.x}</button></div>
    <div class="modal-body" id="pjBody"></div><div class="modal-foot" id="pjFoot"></div>`, "wide");
  pjEdit();
}
function pjEdit(){
  $("#pjBody").innerHTML = `<div class="row-fields"><div class="field"><label for="pjName">Project name</label><input class="input" id="pjName" value="${esc(projForm.name)}" placeholder="e.g. Furuta pendulum controller"></div>
    <div class="field" style="margin:0"><label for="pjUrl">Link <span class="opt">optional</span></label><input class="input" id="pjUrl" value="${esc(projForm.url)}" placeholder="github.com/you/project" inputmode="url"></div></div>
    <div class="field" style="margin-top:16px"><label for="pjText">What's in it</label><textarea class="input paste" id="pjText" rows="9" placeholder="What it does and what you built it with. Pasting README.md, requirements.txt or package.json gives the most accurate read, including how the project uses AI.">${esc(projForm.text)}</textarea></div>
    <p class="fine">Beehive can't open GitHub from this page yet, so paste what matters.</p><div class="status" id="pjStatus" hidden></div>`;
  $("#pjFoot").innerHTML = `<button class="btn quiet" data-act="close">Cancel</button><button class="btn accent" data-act="pj-analyse">Analyse project</button>`;
}
async function analyseProject(){
  projForm = {name:$("#pjName").value.trim(), url:$("#pjUrl").value.trim(), text:$("#pjText").value.trim()};
  if(!projForm.name){ $("#pjName").focus(); $("#pjName").classList.add("invalid"); return; }
  if(projForm.text.length<20){ $("#pjText").focus(); toast("Add a sentence or two about the project"); return; }
  $("[data-act=pj-analyse]").disabled = true;
  setStatus("pjStatus", SAMPLE ? "Reading your project. This takes a few seconds." : "Reading your project");
  let r = null, via = "device";
  try{ const c = await askClaude(PROJECT_PROMPT(projForm.name, projForm.url, projForm.text)); if(c && typeof c==="object" && !Array.isArray(c)){ r = c; via = "claude"; } }catch(e){ return; }
  if(!r) r = analyseProjectLocal(projForm.name, projForm.text);
  const kind = ["none","llm_api","model_training","ai_assisted_dev","multiple"].includes(r.ai?.kind) ? r.ai.kind : "none";
  const skills = [...new Set([...pickSkills(r.skills), ...(AI_SKILL[kind]||[])])];
  projDraft = {id:uid(), name:projForm.name, url:projForm.url, summary:String(r.summary||"").slice(0,160) || projForm.name, skills, picked:new Set(skills), ai:{kind, detail:String(r.ai?.detail||"").slice(0,120)}, size:["small","medium","substantial"].includes(r.size)?r.size:"medium", via};
  if($("#pjBody")) pjPreview();
}
function pjPreview(){
  const d = projDraft, k = d.ai.kind;
  $("#pjBody").innerHTML = `<div class="pv-sum"><b>${esc(d.name)}</b><span class="via">${d.via==="claude"?"Read by Claude":"Read on this device"}</span></div>
    <p style="color:var(--ink-2);margin-top:6px">${esc(d.summary)}</p>
    <div class="ai-box"><span class="label">AI usage</span><div class="ai-kind"><span class="proj-ic">${I.ai}</span><div>${k==="none"?"No AI use detected":esc(AI_LABEL[k])}<small>${esc(d.ai.detail || (k==="none"?"Mention the models or tools you used if this is wrong.":""))}</small></div></div></div>
    <div class="field" style="margin-top:18px"><span class="label">Skills it shows <span class="opt">tap to adjust</span></span>
      <div class="chip-wrap">${[...new Set([...d.skills, ...(FIELD_SKILLS[S.profile.field]||[]).slice(0,4)])].map(x=>`<button class="chip" data-act="pj-skill" data-v="${esc(x)}" aria-pressed="${d.picked.has(x)}">${d.picked.has(x)?I.check:I.plus}${esc(x)}</button>`).join("")}</div></div>
    <p class="fine">${esc(SIZE_LABEL[d.size])}, judged from what you pasted.</p>`;
  $("#pjFoot").innerHTML = `<button class="btn quiet" data-act="pj-edit">${I.chevLeft}Edit</button><button class="btn accent" data-act="pj-save">Save project</button>`;
}
function saveProject(){
  const {picked, via, ...p} = projDraft; p.skills = [...picked];
  S.projects.push(p); save(); closeLayer(); refreshQuals();
  toast(p.ai.kind!=="none" ? "Project added, AI usage noted" : "Project added");
}
function refreshQuals(){
  if(route().page!=="qualifications") return;
  ["skills","courses","projects","plan"].forEach(k=>{ const el=$("#"+k+"Card"); if(el) el.innerHTML = window[k+"Card"](); });
  updateStrengthInline();
}

const mq = matchMedia("(prefers-color-scheme: dark)");
function isDark(){ return S.theme==="system" ? mq.matches : S.theme==="dark"; }
function applyTheme(){
  if(S.theme==="system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = S.theme;
  if($("#sideTheme")) updateShell();
}
mq.addEventListener?.("change", applyTheme);
