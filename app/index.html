   Actions
   ========================================================= */
function toggleSave(id){
  const was = S.saved.includes(id);
  S.saved = was ? S.saved.filter(x=>x!==id) : [...S.saved,id]; save();
  toast(was?"Removed from saved":"Saved", was?()=>{S.saved.push(id);save();refresh()}:null);
  refresh();
}
function togglePlan(s){
  const i = S.plan.findIndex(p=>p.s===s);
  if(i>=0) S.plan.splice(i,1); else S.plan.push({s,done:false});
  save(); toast(i>=0?"Removed from study plan":`${s} added to your study plan`);
  refresh();
}
function addSkill(s){
  s = s.trim(); if(!s || S.skills.some(x=>norm(x)===norm(s))) return;
  S.skills.push(s); ui.qSkill = ""; save();
  $("#skillsCard").innerHTML = skillsCard(); $("#skillQ").focus(); updateStrengthInline();
}
function updateStrengthInline(){ if(route().page==="qualifications"){ const h=$(".page-head .hex"); if(h){ const st=strength(); h.outerHTML = hex(st.pct,60); $(".page-head .muted").textContent = st.next?st.next.label:"Complete"; } } }

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-act]");
  if(!t){ if($(".pop") && !e.target.closest(".pop")) closeLayer(); return; }
  const a = t.dataset.act, v = t.dataset.v;
  switch(a){
    case "theme": S.theme = isDark()?"light":"dark"; save(); applyTheme(); if(route().page==="account") refresh(); break;
    case "set-theme": S.theme = v; save(); applyTheme(); refresh(); break;
    case "region-menu": e.stopPropagation(); $(".pop") ? closeLayer() : regionMenu(); break;
    case "region": closeLayer(); if(S.region!==v){ S.region = v; ui.sim = []; save(); if(route().page==="jobs"){ go("jobs"); ui.page=null; renderPage(); } else refresh(); toast(`Showing jobs in ${COUNTRIES[v]}`);} break;
    case "saved-shortcut": ui.scope = "saved"; ui.page = null; if(route().page==="jobs"){ e.preventDefault(); renderPage(); } break;
    case "type": ui.type = v; $$("#typeChips .chip").forEach(c=>c.setAttribute("aria-pressed", c.dataset.v===v)); renderJobList(); break;
    case "seg": {
      const name = t.dataset.name;
      t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-checked", b===t));
      if(name==="scope"){ ui.scope = v; renderJobList(); }
      else if(name==="listings"){ S.listings = v; save(); rebuildJobs(); toast(v==="live"?"Showing live listings only":v==="mix"?"Showing live and sample listings":"Samples fill in where live roles are few"); }
      else if(name==="level"){ S.profile.level = v; save(); toast("Studies updated"); }
      else if(name==="year"){ S.profile.year = +v; save(); toast("Studies updated"); }
      else if(name.startsWith("lang:")){ S.langs[+name.slice(5)].v = v; save(); }
      break; }
    case "switch": {
      const name = t.dataset.name, on = t.getAttribute("aria-checked")!=="true";
      t.setAttribute("aria-checked", on);
      if(name.startsWith("sim:")){ const s = name.slice(4); ui.sim = on ? [...ui.sim,s] : ui.sim.filter(x=>x!==s); $("#gapCard").innerHTML = gapCard(regionJobs()); }
      if(name.startsWith("notify:")){ S.prefs.notify[name.slice(7)] = on; save(); }
      break; }
    case "clear-q": ui.q = ""; $("#jobQ").value = ""; renderJobList(); $("#jobQ").focus(); break;
    case "reset-filters": ui.q=""; ui.type="all"; ui.mode="all"; ui.scope="all"; ui.page=null; renderPage(); break;
    case "save": toggleSave(t.dataset.id); break;
    case "apply": openApply(t.dataset.id); break;
    case "apply-out": setTimeout(()=>toast("Opened the ad. Come back and tap “I applied” to track it."), 300); break;
    case "mark-applied": { const id = t.dataset.id; if(S.applied[id]) delete S.applied[id]; else { S.applied[id] = Date.now(); if(!S.saved.includes(id)) S.saved.push(id); } save(); refresh(); toast(S.applied[id]?"Marked as applied":"Unmarked"); break; }
    case "submit-apply": submitApply(t.dataset.id); break;
    case "close": closeLayer(); break;
    case "scrim": if(e.target===t) closeLayer(); break;
    case "plan": togglePlan(v); break;
    case "add-skill": addSkill(v); break;
    case "rm-skill": { const i = S.skills.indexOf(v); S.skills.splice(i,1); save(); $("#skillsCard").innerHTML = skillsCard(); updateStrengthInline();
      toast(`Removed ${v}`, ()=>{ S.skills.splice(i,0,v); save(); $("#skillsCard").innerHTML = skillsCard(); updateStrengthInline(); }); break; }
    case "rm-lang": S.langs.splice(+v,1); save(); $("#langCard").innerHTML = langCard(); updateStrengthInline(); break;
    case "link-gh": { const u = $("#ghIn").value.trim().replace(/^@/,"").replace(/^https?:\/\/github\.com\//,"").replace(/\/.*/,"");
      if(!/^[A-Za-z0-9-]{1,39}$/.test(u)){ $("#ghIn").focus(); toast("Enter a valid GitHub username"); break; }
      S.github = u; save(); $("#linksCard").innerHTML = linksCard(); updateStrengthInline(); toast("GitHub linked"); break; }
    case "unlink-gh": S.github = ""; save(); $("#linksCard").innerHTML = linksCard(); updateStrengthInline(); break;
    case "add-cert": { const c = $("#certIn").value.trim(); if(!c) { $("#certIn").focus(); break; } S.certs.push(c); save(); $("#certCard").innerHTML = certCard(); $("#certIn").focus(); updateStrengthInline(); break; }
    case "rm-cert": S.certs.splice(+v,1); save(); $("#certCard").innerHTML = certCard(); updateStrengthInline(); break;
    case "toggle-plan": { const p = S.plan.find(x=>x.s===v); p.done = !p.done;
      if(p.done){ if(LANGS.includes(v)){ if(!S.langs.some(x=>x.l===v)) S.langs.push({l:v,v:"Conversational"}); } else if(!S.skills.includes(v)) S.skills.push(v); toast(`${v} added to your skills`); }
      save(); $("#planCard").innerHTML = planCard(); $("#skillsCard").innerHTML = skillsCard(); $("#langCard").innerHTML = langCard(); updateStrengthInline(); break; }
    case "rm-plan": S.plan = S.plan.filter(x=>x.s!==v); save(); $("#planCard").innerHTML = planCard(); break;
    case "pref-type": { const on = !S.prefs.types.includes(v); S.prefs.types = on?[...S.prefs.types,v]:S.prefs.types.filter(x=>x!==v); t.setAttribute("aria-pressed",on); save(); break; }
    case "reset": modal(`<div class="modal-head"><div class="grow"><h2>Reset everything?</h2><p>This clears your profile, skills, saved roles and study plan. It can't be undone.</p></div></div><div class="modal-foot"><button class="btn quiet" data-act="close">Cancel</button><button class="btn danger" data-act="confirm-reset">Reset everything</button></div>`); break;
    case "import-courses": openCourseImport(); break;
    case "read-courses": readCourses(); break;
    case "ci-toggle": courseDraft[+v].on = !courseDraft[+v].on; ciPreview($("#ciFoot").dataset.via); break;
    case "ci-edit": ciEdit(); break;
    case "ci-add": addDraftCourses(); break;
    case "add-course": openCourseManual(); break;
    case "mc-skill": mcPicked.has(v) ? mcPicked.delete(v) : mcPicked.add(v); t.setAttribute("aria-pressed", mcPicked.has(v)); t.innerHTML = (mcPicked.has(v)?I.check:I.plus)+esc(v); break;
    case "mc-save": { const c = normCourse({name:$("#mcName").value, code:$("#mcCode").value, ects:$("#mcEcts").value, skills:[...mcPicked]});
      if(!c){ $("#mcName").focus(); $("#mcName").classList.add("invalid"); break; }
      S.courses.push(c); save(); closeLayer(); refreshQuals(); toast(`Added ${c.name}`); break; }
    case "rm-course": { const i = S.courses.findIndex(c=>c.id===v); const [c] = S.courses.splice(i,1); save(); refreshQuals();
      toast(`Removed ${c.name}`, ()=>{ S.courses.splice(i,0,c); save(); refreshQuals(); }); break; }
    case "add-project": openProject(); break;
    case "pj-analyse": analyseProject(); break;
    case "pj-edit": pjEdit(); break;
    case "pj-skill": projDraft.picked.has(v) ? projDraft.picked.delete(v) : projDraft.picked.add(v); t.setAttribute("aria-pressed", projDraft.picked.has(v)); t.innerHTML = (projDraft.picked.has(v)?I.check:I.plus)+esc(v); break;
    case "pj-save": saveProject(); break;
    case "rm-project": { const i = S.projects.findIndex(p=>p.id===v); const [p] = S.projects.splice(i,1); save(); refreshQuals();
      toast(`Removed ${p.name}`, ()=>{ S.projects.splice(i,0,p); save(); refreshQuals(); }); break; }
    case "confirm-reset": try{localStorage.removeItem(KEY)}catch(err){} S = DEFAULT(); ui.page=null; closeLayer(); location.hash = ""; applyTheme(); startOnboarding(); break;
  }
});
document.addEventListener("input", e=>{
  const id = e.target.id;
  if(id==="jobQ"){ ui.q = e.target.value; renderJobList(); }
  if(id==="skillQ"){ ui.qSkill = e.target.value; $("#skillSugg").innerHTML = skillSugg(); }
  if(id==="mcName"){ e.target.classList.remove("invalid"); mcRender(); }
  if(id==="pjName"){ e.target.classList.remove("invalid"); }
});
document.addEventListener("change", e=>{
  const t = e.target, b = t.dataset.bind;
  if(t.id==="fMode"){ ui.mode = t.value; renderJobList(); }
  if(t.id==="fSort"){ ui.sort = t.value; renderJobList(); }
  if(t.id==="langAdd" && t.value){ S.langs.push({l:t.value,v:"Conversational"}); save(); $("#langCard").innerHTML = langCard(); updateStrengthInline(); }
  if(b==="programme"){ S.profile.programme = t.value.trim(); save(); toast("Studies updated"); }
  if(b==="portfolio"){ S.portfolio = t.value.trim(); save(); updateStrengthInline(); if(S.portfolio) toast("Link saved"); }
  if(b==="name"){ S.profile.name = t.value.trim(); save(); updateShell(); $(".acc-head").outerHTML; refresh(); toast("Saved"); }
  if(b==="email"){ const ok = !t.value || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t.value.trim()); t.classList.toggle("invalid",!ok); if(ok){ S.profile.email = t.value.trim(); save(); toast("Saved"); } }
  if(t.id==="acUni"){ S.profile.uni = t.value; S.profile.cc = Object.keys(UNIS).find(k=>UNIS[k].includes(t.value)); save(); refresh(); toast("Studies updated"); }
  if(t.id==="acField"){ S.profile.field = t.value; save(); refresh(); toast("Studies updated"); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if($("#layer").innerHTML) closeLayer(); }
  if(e.key==="Enter"){
    if(e.target.id==="skillQ"){ e.preventDefault(); const q = e.target.value.trim(); const hit = SKILLS.find(s=>norm(s)===norm(q)) || SKILLS.find(s=>norm(s).startsWith(norm(q))); addSkill(hit||q); }
    if(e.target.id==="certIn"){ e.preventDefault(); $("[data-act=add-cert]").click(); }
    if(e.target.id==="ghIn"){ e.preventDefault(); $("[data-act=link-gh]").click(); }
  }
  if(e.key==="/" && route().page==="jobs" && !/input|textarea|select/i.test(e.target.tagName)){ e.preventDefault(); $("#jobQ")?.focus(); }
});

/* =========================================================
   Onboarding
   ========================================================= */
const COMB = [[0,0],[69.3,0],[34.6,60],[-34.6,60],[-69.3,0],[-34.6,-60],[34.6,-60]];
const cellPath = ([x,y],r=36) => { const pts=[-90,-30,30,90,150,210].map(a=>{const t=a*Math.PI/180;return `${(x+r*Math.cos(t)).toFixed(1)},${(y+r*Math.sin(t)).toFixed(1)}`}); return `M${pts.join("L")}Z`; };
const combSVG = (filled, cls="") => `<svg viewBox="-112 -104 224 208" class="${cls}" aria-hidden="true">${COMB.map((c,i)=>`<path class="cell ${i<filled?"on":i===filled?"half":""}" d="${cellPath(c)}" style="animation-delay:${i*.16}s"/>`).join("")}</svg>`;

let ob, obShown = null;
const OB_STEPS = ["name","uni","field","phase","skills","goals"];
function startOnboarding(){
  obShown = null;
  ob = {step:-1, name:"", programme:"", uni:"", cc:"", field:"", level:"Bachelor's", year:1, skills:[], types:[], region:"", q:"", active:0};
  renderShellBlank(); renderOb();
}
function renderShellBlank(){ $("#app").innerHTML = `<div class="ob" id="ob"></div>`; }
function obValid(){
  const k = OB_STEPS[ob.step];
  return k==="name" ? ob.name.trim().length>0 : k==="uni" ? !!ob.uni : k==="field" ? !!ob.field : k==="goals" ? ob.types.length>0 : true;
}
function gradYear(){
  const total = LEVEL_YEARS[ob.level]; const left = Math.max(0, total - ob.year);
  return new Date().getFullYear() + left + (new Date().getMonth()>=6?1:0);
}
function uniMatches(){
  const q = norm(ob.q);
  const all = Object.entries(UNIS).flatMap(([cc,us])=>us.map(u=>({u,cc})));
  return (q ? all.filter(x=>norm(x.u).includes(q) || norm(COUNTRIES[x.cc]).includes(q)) : all).slice(0, q?8:7);
}
function obStepHTML(){
  const k = OB_STEPS[ob.step];
  if(ob.step===-1) return `<div class="welcome step-anim">
      ${combSVG(0,"comb-m animfill")}
      <h1>Find work that fits what you study.</h1>
      <p class="lede">Beehive matches your degree against open roles across the Nordics, then shows you exactly what would raise your chances.</p>
      <div><button class="btn accent lg" data-ob="next">Get started</button></div>
      <p class="note">Takes about a minute. No account needed.</p></div>`;
  if(k==="name") return `<div class="step-anim"><h1>What's your first name?</h1><p class="lede">So we know what to call you.</p>
      <input class="input big-input" id="obName" value="${esc(ob.name)}" placeholder="First name" autocomplete="given-name" aria-label="First name"></div>`;
  if(k==="uni") return `<div class="step-anim"><h1>Where do you study, ${esc(ob.name.trim().split(" ")[0])}?</h1><p class="lede">We'll start with jobs near your university.</p>
      <label class="search" style="height:56px">${I.search}<input id="obUni" placeholder="Search universities" value="${esc(ob.q)}" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="uniList" aria-label="Search universities"></label>
      <div class="combo-list" id="uniList" role="listbox">${uniList()}</div></div>`;
  if(k==="field") return `<div class="step-anim"><h1>What's your degree?</h1><p class="lede">Pick the closest match. You can change it later.</p>
      <div class="deg-grid" role="radiogroup">${FIELDS.map(f=>`<button class="deg" role="radio" aria-checked="${ob.field===f}" data-ob="field" data-v="${esc(f)}">${FIELD_ICON[FIELD_KEY[f]]}${esc(f)}</button>`).join("")}</div>
      <div class="field" style="margin-top:24px"><label for="obProg">Programme name <span class="opt">optional</span></label><input class="input" id="obProg" value="${esc(ob.programme)}" placeholder="e.g. Electrical Engineering and Automation"></div></div>`;
  if(k==="phase") return `<div class="step-anim"><h1>How far along are you?</h1><p class="lede">Some roles are only open to later-year students.</p>
      <p class="ob-label">Level</p>${seg("ob-level",LEVELS.map(l=>[l,l]),ob.level,"lg")}
      <p class="ob-label">Year of this degree</p><div class="years" role="radiogroup">${[1,2,3,4,5].map(y=>`<button class="year" role="radio" aria-checked="${ob.year===y}" data-ob="year" data-v="${y}">${y}</button>`).join("")}</div>
      <div class="grad-note">${I.calendar}${ob.year>=LEVEL_YEARS[ob.level]?"Final year, so graduate roles are in play":`Graduating around ${gradYear()}`}</div></div>`;
  if(k==="skills"){ const sugg = [...new Set([...(FIELD_SKILLS[ob.field]||[]), ...SKILLS])].slice(0,16);
    return `<div class="step-anim"><h1>What can you already do?</h1><p class="lede">Pick anything you've used in a course or project. It makes your scores real.</p>
      <div class="chip-wrap">${sugg.map(s=>`<button class="chip" data-ob="skill" data-v="${esc(s)}" aria-pressed="${ob.skills.includes(s)}">${ob.skills.includes(s)?I.check:I.plus}${esc(s)}</button>`).join("")}</div></div>`; }
  if(k==="goals") return `<div class="step-anim"><h1>What are you looking for?</h1><p class="lede">Choose all that apply.</p>
      <p class="ob-label">Kinds of work</p><div class="chip-wrap">${TYPES.map(t=>`<button class="chip" data-ob="type" data-v="${t}" aria-pressed="${ob.types.includes(t)}">${ob.types.includes(t)?I.check:""}${t}</button>`).join("")}</div>
      <p class="ob-label">Start in</p>${seg("ob-region",Object.entries(COUNTRIES),ob.region||ob.cc,"")}</div>`;
}
function uniList(){
  const list = uniMatches();
  if(!list.length) return `<div class="combo-opt"><span class="grow muted">No match. Try a shorter name.</span></div>`;
  ob.active = Math.min(ob.active, list.length-1);
  return list.map((x,i)=>`<button class="combo-opt ${i===ob.active?"active":""}" role="option" aria-selected="${ob.uni===x.u}" data-ob="uni" data-v="${esc(x.u)}" data-cc="${x.cc}"><span class="grow">${esc(x.u)}</span><span class="cc">${COUNTRIES[x.cc]}</span>${ob.uni===x.u?I.check.replace("<svg",'<svg class="ok"'):""}</button>`).join("");
}
function renderOb(){
  const s = ob.step, total = OB_STEPS.length;
  const filled = s<0 ? 0 : s+1;
  const k = OB_STEPS[s];
  const nextLabel = s===-1 ? "" : s===total-1 ? "Show my matches" : k==="skills" && !ob.skills.length ? "Skip for now" : "Continue";
  $("#ob").innerHTML = `
    <aside class="ob-panel">
      <div class="brand">${LOGO}<span>beehive</span></div>
      <div class="comb">${combSVG(filled, s<0?"animfill":"")}</div>
      <div class="foot"><div><b>${JOBS.length}</b>open roles</div><div><b>${Object.keys(COUNTRIES).length}</b>countries</div><div><b>${Object.values(UNIS).flat().length}</b>universities</div></div>
    </aside>
    <section class="ob-main">
      <div class="ob-top"><div class="brand">${LOGO}<span>beehive</span></div>
        ${s>=0?`<div class="ob-progress"><span class="bar-track"><i style="width:${(s+1)/total*100}%"></i></span><span>Step ${s+1} of ${total}</span></div>`:""}</div>
      <div class="ob-body">${obStepHTML().replace("step-anim", obShown===s ? "" : "step-anim")}</div>
      ${s>=0?`<div class="ob-foot"><button class="btn quiet" data-ob="back">${I.chevLeft}Back</button><span class="hint">Press <kbd>Enter</kbd></span><button class="btn accent" data-ob="next" ${obValid()?"":"disabled"}>${nextLabel}</button></div>`:""}
    </section>`;
  const changed = obShown!==s; obShown = s;
  const focusEl = $("#obName") || $("#obUni") || (OB_STEPS[s]==="field" && document.activeElement?.id==="obProg" ? null : null) || (changed && s>=0 ? $(".ob-body .deg[aria-checked=true]") || $(".ob-body .deg") : null);
  focusEl?.focus({preventScroll:true});
  if(focusEl && focusEl.tagName==="INPUT"){ const n = focusEl.value.length; focusEl.setSelectionRange(n,n); }
}
function refreshObFoot(){ const n = $("[data-ob=next]"); if(n){ n.disabled = !obValid(); if(OB_STEPS[ob.step]==="skills") n.textContent = ob.skills.length?"Continue":"Skip for now"; } }
function obNext(){
  if(ob.step>=0 && !obValid()) return;
  if(ob.step===OB_STEPS.length-1) return finishOnboarding();
  ob.step++;
  if(OB_STEPS[ob.step]==="goals" && !ob.types.length){
    ob.types = ob.level==="Bachelor's" ? (ob.year>=3?["Internship","Summer job","Graduate"]:["Internship","Summer job","Part-time"]) : ["Internship","Thesis","Graduate"];
  }
  renderOb();
}
function finishOnboarding(){
  S.profile = {name:ob.name.trim(), email:"", programme:ob.programme.trim(), uni:ob.uni, cc:ob.cc, field:ob.field, level:ob.level, year:ob.year};
  S.skills = ob.skills.slice(); S.prefs.types = ob.types.slice(); S.region = ob.region || ob.cc || "FI"; save();
  const n = JOBS.filter(j=>j.cc===S.region).length;
  $("#app").innerHTML = `<div class="building" role="status">${combSVG(0)}<p>Matching you with ${n} roles in ${COUNTRIES[S.region]}</p><small>Checking degree, skills and study phase</small></div>`;
  setTimeout(()=>{ renderShell(); ui.page=null; location.hash="#/home"; renderPage(); }, matchMedia("(prefers-reduced-motion: reduce)").matches?200:1700);
}
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-ob]"); if(!t || !ob || S.profile) return;
  const a = t.dataset.ob, v = t.dataset.v;
  if(a==="next") return obNext();
  if(a==="back"){ ob.step--; return renderOb(); }
  if(a==="uni"){ ob.uni = v; ob.cc = t.dataset.cc; ob.q = v; $("#obUni").value = v; $("#uniList").innerHTML = uniList(); refreshObFoot(); $("[data-ob=next]").focus(); return; }
  if(a==="field"){ ob.field = v; $$(".deg").forEach(d=>d.setAttribute("aria-checked", d.dataset.v===v)); refreshObFoot(); return; }
  if(a==="year"){ ob.year = +v; return renderOb(); }
  if(a==="skill"){ ob.skills = ob.skills.includes(v)?ob.skills.filter(x=>x!==v):[...ob.skills,v]; t.setAttribute("aria-pressed", ob.skills.includes(v)); t.innerHTML = (ob.skills.includes(v)?I.check:I.plus)+esc(v); refreshObFoot(); return; }
  if(a==="type"){ ob.types = ob.types.includes(v)?ob.types.filter(x=>x!==v):[...ob.types,v]; t.setAttribute("aria-pressed", ob.types.includes(v)); t.innerHTML = (ob.types.includes(v)?I.check:"")+esc(v); refreshObFoot(); return; }
});
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-act=seg]"); if(!t || !ob || S.profile) return;
  if(t.dataset.name==="ob-level"){ ob.level = t.dataset.v; if(ob.year>5) ob.year=5; renderOb(); }
  if(t.dataset.name==="ob-region"){ ob.region = t.dataset.v; }
});
document.addEventListener("input", e=>{
  if(!ob || S.profile) return;
  if(e.target.id==="obName"){ ob.name = e.target.value; refreshObFoot(); }
  if(e.target.id==="obProg"){ ob.programme = e.target.value; }
  if(e.target.id==="obUni"){ ob.q = e.target.value; ob.active = 0; if(ob.uni && ob.q!==ob.uni){ ob.uni=""; } $("#uniList").innerHTML = uniList(); refreshObFoot(); }
});
document.addEventListener("keydown", e=>{
  if(!ob || S.profile || !$("#ob")) return;
  if(e.target.id==="obUni" && (e.key==="ArrowDown"||e.key==="ArrowUp")){
    e.preventDefault(); const n = uniMatches().length; ob.active = (ob.active + (e.key==="ArrowDown"?1:-1) + n) % n; $("#uniList").innerHTML = uniList(); $(".combo-opt.active")?.scrollIntoView({block:"nearest"}); return;
  }
  if(e.key==="Enter"){
    if(e.target.id==="obUni" && !ob.uni){ e.preventDefault(); $(".combo-opt.active")?.click(); return; }
    if(e.target.tagName==="BUTTON" && e.target.dataset.ob && e.target.dataset.ob!=="next") return;
    e.preventDefault(); obNext();
  }
});

/* =========================================================
   Boot
   ========================================================= */
applyTheme();
rebuildJobs(); fetchLive();
if(S.profile){ renderShell(); renderPage(); } else startOnboarding();
</script>
</body>
</html>
